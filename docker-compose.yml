services:
  # BACKEND
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    container_name: verseny_backend
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI} # Vagy az Atlas link
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "3000:3000"

  # FRONTEND
  frontend:
    build: ./frontend
    container_name: verseny_frontend
    restart: always
    depends_on:
      - backend

  # NGINX PROXY (Ez fogja kiszolgálni a frontendet és proxyzni a backend API hívásokat)
  nginx:
    image: nginx:stable-alpine
    container_name: verseny_proxy
    ports:
      - "80:80" # Csak az Nginx érhető el kívülről!
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  mongo_data:
