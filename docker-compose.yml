services:
  # ADATBÁZIS (Ha nem a felhős Atlas-t használod, hanem sajátot akarsz)
  mongodb:
    image: mongo:latest
    container_name: verseny_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # BACKEND
  backend:
    build: ./backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    container_name: verseny_backend
    restart: always
    environment:
      - MONGO_URI=${MONGO_URI} # Vagy az Atlas link
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    ports:
      - "3000:3000"

  # FRONTEND
  frontend:
    build: ./frontend
    container_name: verseny_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data: