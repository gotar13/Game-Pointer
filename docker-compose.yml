version: '3.8'
services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3001:3000"
    env_file: .env
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
    depends_on:
      - backend
    restart: always
