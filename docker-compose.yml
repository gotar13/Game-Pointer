version: '4.0'
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/nginx/certs:ro  # Self-signed SSL certificates (read-only)
    depends_on:
      - backend
      - frontend
    restart: always

  backend:
    build: ./backend
    container_name: backend
    environment:
      - PORT=3001
    env_file: .env
    restart: always

  frontend:
    build: ./frontend
    container_name: frontend
    environment:
      - REACT_APP_API_URL=/api
    env_file: .env
    depends_on:
      - backend
    restart: always
